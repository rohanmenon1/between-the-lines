name: Minimal Codex plugin

on:
  push:
    branches: [codex-plugin-minimal]
    paths:
      - 'codex-minimal/**'
      - '.github/workflows/codex-minimal.yml'

permissions:
  contents: read

jobs:
  approval-flow:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python codex-minimal/test_flow.py
      - name: Measure native Windows stdio process overhead
        run: ./codex-minimal/measure_windows_floor.ps1
        shell: pwsh
      - name: Measure MCP memory and lookup latency
        run: ./codex-minimal/measure_server.ps1
        shell: pwsh
      - name: Package and exercise installed Codex plugin
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'between-the-lines-codex.zip'
          git archive --format=zip --output=$zip HEAD:codex-minimal .agents plugin README.md
          npm install --prefix "$env:RUNNER_TEMP/codex-cli" @openai/codex@0.172.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-ChildItem "$env:RUNNER_TEMP/codex-cli" -Recurse -Filter codex.exe | Select-Object -First 1
          python codex-minimal/test_codex_install.py $exe.FullName $zip
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plugin-tested
          path: ${{ runner.temp }}/between-the-lines-codex.zip
          if-no-files-found: error
