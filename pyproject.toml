[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "between-the-lines"
version = "0.1.0"
description = "Annotate Python and Java files with small-model comments and syntax validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "bitsandbytes==0.49.0",
    "gradio==5.50.0",
    "huggingface_hub",
    "peft==0.18.0",
    "safetensors",
    "spaces",
    "torch",
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "truststore",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
]

[tool.setuptools.packages.find]
include = ["btl*"]
